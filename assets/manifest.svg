<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="fleet manifest — ten vessels">
  <style>
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .dot{animation:pulse 2.6s ease-in-out infinite}
    @keyframes sweep{from{transform:translateY(-10px)}to{transform:translateY(550px)}}
    .sweep{animation:sweep 10s linear infinite}
  </style>

  <!-- Panel -->
  <rect x="1" y="1" width="938" height="538" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <clipPath id="panel"><rect x="1" y="1" width="938" height="538" rx="12"/></clipPath>
  <g clip-path="url(#panel)"><rect class="sweep" width="940" height="3" fill="#0ea5e9" opacity="0.06"/></g>

  <!-- Header -->
  <text x="36" y="42" font-size="15" letter-spacing="2" fill="#0ea5e9" font-weight="bold">⟨ FLEET MANIFEST ⟩</text>
  <text x="904" y="42" font-size="12.5" letter-spacing="1.5" fill="#94a3b8" text-anchor="end">TEN VESSELS · ALL OPERATIONAL</text>
  <line x1="24" y1="58" x2="916" y2="58" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Column headers -->
  <text x="62" y="80" font-size="10" letter-spacing="2" fill="#94a3b8">VESSEL</text>
  <text x="260" y="80" font-size="10" letter-spacing="2" fill="#94a3b8" text-anchor="middle">CLASS</text>
  <text x="380" y="80" font-size="10" letter-spacing="2" fill="#94a3b8">DIRECTIVE</text>
  <text x="904" y="80" font-size="10" letter-spacing="2" fill="#94a3b8" text-anchor="end">STATUS</text>
  <line x1="36" y1="90" x2="904" y2="90" stroke="#f1f5f9" stroke-width="1"/>

  <!-- JARVIS -->
  <circle class="dot" cx="44" cy="108" r="3.5" fill="#22c55e"/>
  <text x="62" y="113" font-size="15" letter-spacing="2" fill="#0f172a" font-weight="bold">JARVIS</text>
  <rect x="210" y="96" width="100" height="20" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-opacity="0.3"/>
  <text x="260" y="110" font-size="11" letter-spacing="1" fill="#0ea5e9" text-anchor="middle">agent</text>
  <text x="380" y="112" font-size="13" fill="#64748b">Persistent AI assistant — voice, memory, identity, proactive intelligence</text>
  <text x="904" y="112" font-size="11" letter-spacing="2" fill="#22c55e" text-anchor="end" font-weight="600">● LIVE</text>

  <!-- CRYPTO-TRADING-SYSTEM -->
  <circle class="dot" cx="44" cy="156" r="3.5" fill="#ef4444" style="animation-delay:-.4s"/>
  <text x="62" y="161" font-size="15" letter-spacing="2" fill="#0f172a" font-weight="bold">CRYPTO-TRADING-SYSTEM</text>
  <rect x="210" y="144" width="100" height="20" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-opacity="0.3"/>
  <text x="260" y="158" font-size="11" letter-spacing="1" fill="#ef4444" text-anchor="middle">engine</text>
  <text x="380" y="160" font-size="13" fill="#64748b">Multi-exchange spot/futures execution with risk management</text>
  <text x="904" y="160" font-size="11" letter-spacing="2" fill="#ef4444" text-anchor="end" font-weight="600">● CLASSIFIED</text>

  <!-- CRYPTO-ALPHA-ENGINE -->
  <circle class="dot" cx="44" cy="204" r="3.5" fill="#ef4444" style="animation-delay:-.8s"/>
  <text x="62" y="209" font-size="15" letter-spacing="2" fill="#0f172a" font-weight="bold">CRYPTO-ALPHA-ENGINE</text>
  <rect x="210" y="192" width="100" height="20" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-opacity="0.3"/>
  <text x="260" y="206" font-size="11" letter-spacing="1" fill="#ef4444" text-anchor="middle">alpha</text>
  <text x="380" y="208" font-size="13" fill="#64748b">Alpha signal generation across DeFi and CEX markets</text>
  <text x="904" y="208" font-size="11" letter-spacing="2" fill="#ef4444" text-anchor="end" font-weight="600">● CLASSIFIED</text>

  <!-- NASH-AGENT -->
  <circle class="dot" cx="44" cy="252" r="3.5" fill="#22c55e" style="animation-delay:-1.2s"/>
  <text x="62" y="257" font-size="15" letter-spacing="2" fill="#0f172a" font-weight="bold">NASH-AGENT</text>
  <rect x="210" y="240" width="100" height="20" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-opacity="0.3"/>
  <text x="260" y="254" font-size="11" letter-spacing="1" fill="#0ea5e9" text-anchor="middle">theory</text>
  <text x="380" y="256" font-size="13" fill="#64748b">9-stage game-theoretic decision loop — autonomous strategic reasoning</text>
  <text x="904" y="256" font-size="11" letter-spacing="2" fill="#22c55e" text-anchor="end" font-weight="600">● ACTIVE</text>

  <!-- TELEGRAM-TRADE-SIGNALS -->
  <circle class="dot" cx="44" cy="300" r="3.5" fill="#22c55e" style="animation-delay:-1.6s"/>
  <text x="62" y="305" font-size="15" letter-spacing="2" fill="#0f172a" font-weight="bold">TELEGRAM-TRADE-SIGNALS</text>
  <rect x="210" y="288" width="100" height="20" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="260" y="302" font-size="11" letter-spacing="1" fill="#22c55e" text-anchor="middle">radar</text>
  <text x="380" y="304" font-size="13" fill="#64748b">CBW Radar — volume scanner, 28 pairs, 67.7% WR backtest</text>
  <text x="904" y="304" font-size="11" letter-spacing="2" fill="#22c55e" text-anchor="end" font-weight="600">● DEPLOYED</text>

  <!-- MEMPOOL-SCALPER -->
  <circle class="dot" cx="44" cy="348" r="3.5" fill="#f59e0b" style="animation-delay:-2s"/>
  <text x="62" y="353" font-size="15" letter-spacing="2" fill="#0f172a" font-weight="bold">MEMPOOL-SCALPER</text>
  <rect x="210" y="336" width="100" height="20" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-opacity="0.3"/>
  <text x="260" y="350" font-size="11" letter-spacing="1" fill="#f59e0b" text-anchor="middle">offense</text>
  <text x="380" y="352" font-size="13" fill="#64748b">Mempool sniping and front-running detection for MEV</text>
  <text x="904" y="352" font-size="11" letter-spacing="2" fill="#f59e0b" text-anchor="end" font-weight="600">● BUILDING</text>

  <!-- WIFI-3D-MAPPER -->
  <circle class="dot" cx="44" cy="396" r="3.5" fill="#22c55e" style="animation-delay:-2.4s"/>
  <text x="62" y="401" font-size="15" letter-spacing="2" fill="#0f172a" font-weight="bold">WIFI-3D-MAPPER</text>
  <rect x="210" y="384" width="100" height="20" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="260" y="398" font-size="11" letter-spacing="1" fill="#22c55e" text-anchor="middle">sensing</text>
  <text x="380" y="400" font-size="13" fill="#64748b">WiFi-based 3D spatial sensing and human detection</text>
  <text x="904" y="400" font-size="11" letter-spacing="2" fill="#22c55e" text-anchor="end" font-weight="600">● ACTIVE</text>

  <!-- CEYLONGEMS-MARKETPLACE -->
  <circle class="dot" cx="44" cy="444" r="3.5" fill="#22c55e" style="animation-delay:-2.8s"/>
  <text x="62" y="449" font-size="15" letter-spacing="2" fill="#0f172a" font-weight="bold">CEYLONGEMS</text>
  <rect x="210" y="432" width="100" height="20" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="260" y="446" font-size="11" letter-spacing="1" fill="#22c55e" text-anchor="middle">commerce</text>
  <text x="380" y="448" font-size="13" fill="#64748b">Sri Lankan gemstone marketplace — full-stack e-commerce</text>
  <text x="904" y="448" font-size="11" letter-spacing="2" fill="#22c55e" text-anchor="end" font-weight="600">● LIVE</text>

  <!-- SOFTWARE-FACTORY -->
  <circle class="dot" cx="44" cy="492" r="3.5" fill="#22c55e" style="animation-delay:-3.2s"/>
  <text x="62" y="497" font-size="15" letter-spacing="2" fill="#0f172a" font-weight="bold">SOFTWARE-FACTORY</text>
  <rect x="210" y="480" width="100" height="20" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-opacity="0.3"/>
  <text x="260" y="494" font-size="11" letter-spacing="1" fill="#0ea5e9" text-anchor="middle">factory</text>
  <text x="380" y="496" font-size="13" fill="#64748b">Plans in, pull requests out — software that builds software</text>
  <text x="904" y="496" font-size="11" letter-spacing="2" fill="#22c55e" text-anchor="end" font-weight="600">● ACTIVE</text>
</svg>
