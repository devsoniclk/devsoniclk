<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="fleet manifest — ten vessels">
  <style>
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .dot{animation:pulse 2.6s ease-in-out infinite}
  </style>

  <!-- Panel -->
  <rect x="1" y="1" width="938" height="558" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" font-size="15" letter-spacing="2" fill="#0ea5e9" font-weight="bold">⟨ FLEET MANIFEST ⟩</text>
  <text x="904" y="42" font-size="12.5" letter-spacing="1.5" fill="#94a3b8" text-anchor="end">TEN VESSELS · ALL OPERATIONAL</text>
  <line x1="24" y1="58" x2="916" y2="58" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Column headers -->
  <text x="44" y="82" font-size="10" letter-spacing="2" fill="#94a3b8" font-weight="600">VESSEL</text>
  <text x="260" y="82" font-size="10" letter-spacing="2" fill="#94a3b8" font-weight="600" text-anchor="middle">CLASS</text>
  <text x="360" y="82" font-size="10" letter-spacing="2" fill="#94a3b8" font-weight="600">DIRECTIVE</text>
  <text x="904" y="82" font-size="10" letter-spacing="2" fill="#94a3b8" font-weight="600" text-anchor="end">STATUS</text>
  <line x1="36" y1="92" x2="904" y2="92" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 1: JARVIS -->
  <circle class="dot" cx="44" cy="112" r="4" fill="#22c55e"/>
  <text x="60" y="117" font-size="14" letter-spacing="1.5" fill="#0f172a" font-weight="bold">JARVIS</text>
  <rect x="220" y="100" width="80" height="20" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="260" y="114" font-size="10.5" letter-spacing="1" fill="#1d4ed8" text-anchor="middle" font-weight="600">agent</text>
  <text x="360" y="116" font-size="12.5" fill="#475569">AI assistant — voice, memory, identity, proactive</text>
  <text x="904" y="115" font-size="11" letter-spacing="1" fill="#16a34a" text-anchor="end" font-weight="700">● LIVE</text>

  <!-- Row 2: CRYPTO-TRADING-SYSTEM -->
  <circle class="dot" cx="44" cy="160" r="4" fill="#ef4444" style="animation-delay:-.4s"/>
  <text x="60" y="165" font-size="14" letter-spacing="1.5" fill="#0f172a" font-weight="bold">CRYPTO-TRADING</text>
  <rect x="220" y="148" width="80" height="20" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="260" y="162" font-size="10.5" letter-spacing="1" fill="#b91c1c" text-anchor="middle" font-weight="600">engine</text>
  <text x="360" y="164" font-size="12.5" fill="#475569">Multi-exchange spot/futures execution</text>
  <text x="904" y="163" font-size="11" letter-spacing="1" fill="#dc2626" text-anchor="end" font-weight="700">● CLASSIFIED</text>

  <!-- Row 3: CRYPTO-ALPHA-ENGINE -->
  <circle class="dot" cx="44" cy="208" r="4" fill="#ef4444" style="animation-delay:-.8s"/>
  <text x="60" y="213" font-size="14" letter-spacing="1.5" fill="#0f172a" font-weight="bold">CRYPTO-ALPHA</text>
  <rect x="220" y="196" width="80" height="20" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="260" y="210" font-size="10.5" letter-spacing="1" fill="#b91c1c" text-anchor="middle" font-weight="600">alpha</text>
  <text x="360" y="212" font-size="12.5" fill="#475569">Alpha signals across DeFi and CEX markets</text>
  <text x="904" y="211" font-size="11" letter-spacing="1" fill="#dc2626" text-anchor="end" font-weight="700">● CLASSIFIED</text>

  <!-- Row 4: NASH-AGENT -->
  <circle class="dot" cx="44" cy="256" r="4" fill="#22c55e" style="animation-delay:-1.2s"/>
  <text x="60" y="261" font-size="14" letter-spacing="1.5" fill="#0f172a" font-weight="bold">NASH-AGENT</text>
  <rect x="220" y="244" width="80" height="20" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="260" y="258" font-size="10.5" letter-spacing="1" fill="#1d4ed8" text-anchor="middle" font-weight="600">theory</text>
  <text x="360" y="260" font-size="12.5" fill="#475569">9-stage game-theoretic decision loop</text>
  <text x="904" y="259" font-size="11" letter-spacing="1" fill="#16a34a" text-anchor="end" font-weight="700">● ACTIVE</text>

  <!-- Row 5: TELEGRAM-TRADE-SIGNALS -->
  <circle class="dot" cx="44" cy="304" r="4" fill="#22c55e" style="animation-delay:-1.6s"/>
  <text x="60" y="309" font-size="14" letter-spacing="1.5" fill="#0f172a" font-weight="bold">CBW-RADAR</text>
  <rect x="220" y="292" width="80" height="20" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="260" y="306" font-size="10.5" letter-spacing="1" fill="#15803d" text-anchor="middle" font-weight="600">radar</text>
  <text x="360" y="308" font-size="12.5" fill="#475569">Volume scanner, 28 pairs, 67.7% WR backtest</text>
  <text x="904" y="307" font-size="11" letter-spacing="1" fill="#16a34a" text-anchor="end" font-weight="700">● DEPLOYED</text>

  <!-- Row 6: MEMPOOL-SCALPER -->
  <circle class="dot" cx="44" cy="352" r="4" fill="#f59e0b" style="animation-delay:-2s"/>
  <text x="60" y="357" font-size="14" letter-spacing="1.5" fill="#0f172a" font-weight="bold">MEMPOOL-SCALPER</text>
  <rect x="220" y="340" width="80" height="20" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="260" y="354" font-size="10.5" letter-spacing="1" fill="#b45309" text-anchor="middle" font-weight="600">offense</text>
  <text x="360" y="356" font-size="12.5" fill="#475569">Mempool sniping and MEV detection</text>
  <text x="904" y="355" font-size="11" letter-spacing="1" fill="#d97706" text-anchor="end" font-weight="700">● BUILDING</text>

  <!-- Row 7: WIFI-3D-MAPPER -->
  <circle class="dot" cx="44" cy="400" r="4" fill="#22c55e" style="animation-delay:-2.4s"/>
  <text x="60" y="405" font-size="14" letter-spacing="1.5" fill="#0f172a" font-weight="bold">WIFI-3D-MAPPER</text>
  <rect x="220" y="388" width="80" height="20" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="260" y="402" font-size="10.5" letter-spacing="1" fill="#15803d" text-anchor="middle" font-weight="600">sensing</text>
  <text x="360" y="404" font-size="12.5" fill="#475569">WiFi-based 3D spatial human detection</text>
  <text x="904" y="403" font-size="11" letter-spacing="1" fill="#16a34a" text-anchor="end" font-weight="700">● ACTIVE</text>

  <!-- Row 8: CEYLONGEMS -->
  <circle class="dot" cx="44" cy="448" r="4" fill="#22c55e" style="animation-delay:-2.8s"/>
  <text x="60" y="453" font-size="14" letter-spacing="1.5" fill="#0f172a" font-weight="bold">CEYLONGEMS</text>
  <rect x="220" y="436" width="80" height="20" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="260" y="450" font-size="10.5" letter-spacing="1" fill="#15803d" text-anchor="middle" font-weight="600">commerce</text>
  <text x="360" y="452" font-size="12.5" fill="#475569">Sri Lankan gemstone marketplace — e-commerce</text>
  <text x="904" y="451" font-size="11" letter-spacing="1" fill="#16a34a" text-anchor="end" font-weight="700">● LIVE</text>

  <!-- Row 9: SOFTWARE-FACTORY -->
  <circle class="dot" cx="44" cy="496" r="4" fill="#22c55e" style="animation-delay:-3.2s"/>
  <text x="60" y="501" font-size="14" letter-spacing="1.5" fill="#0f172a" font-weight="bold">SOFTWARE-FACTORY</text>
  <rect x="220" y="484" width="80" height="20" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="260" y="498" font-size="10.5" letter-spacing="1" fill="#1d4ed8" text-anchor="middle" font-weight="600">factory</text>
  <text x="360" y="500" font-size="12.5" fill="#475569">Plans in, PRs out — software that builds software</text>
  <text x="904" y="499" font-size="11" letter-spacing="1" fill="#16a34a" text-anchor="end" font-weight="700">● ACTIVE</text>
</svg>
