<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="straw hat fleet manifest">
  <defs>
    <linearGradient id="fire3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4444"/>
      <stop offset="1" stop-color="#ffa500"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes bounty{0%,100%{opacity:1}50%{opacity:.6}}
    .bounty{animation:bounty 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .dot{animation:pulse 2s ease-in-out infinite}
  </style>

  <!-- Panel -->
  <rect x="1" y="1" width="938" height="618" rx="14" fill="#111" stroke="#ff4444" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Header -->
  <text x="36" y="42" font-size="14" letter-spacing="3" fill="#ff6b35" font-weight="bold">☠ STRAW HAT FLEET</text>
  <text x="904" y="42" font-size="12" letter-spacing="1.5" fill="#555" text-anchor="end">10 SHIPS · ALL SAILING</text>
  <line x1="24" y1="56" x2="916" y2="56" stroke="#ff4444" stroke-opacity="0.15"/>

  <!-- Column headers -->
  <text x="44" y="80" font-size="10" letter-spacing="2" fill="#555" font-weight="600">VESSEL</text>
  <text x="270" y="80" font-size="10" letter-spacing="2" fill="#555" font-weight="600" text-anchor="middle">CLASS</text>
  <text x="380" y="80" font-size="10" letter-spacing="2" fill="#555" font-weight="600">MISSION</text>
  <text x="904" y="80" font-size="10" letter-spacing="2" fill="#555" font-weight="600" text-anchor="end">STATUS</text>
  <line x1="36" y1="90" x2="904" y2="90" stroke="#222" stroke-width="1"/>

  <!-- Ship 1: JARVIS -->
  <circle class="dot" cx="44" cy="112" r="5" fill="#22c55e"/>
  <text x="60" y="117" font-size="14" letter-spacing="2" fill="#ffffff" font-weight="bold">JARVIS</text>
  <rect x="228" y="100" width="84" height="22" rx="11" fill="#ff4444" fill-opacity="0.15" stroke="#ff4444" stroke-opacity="0.4"/>
  <text x="270" y="116" font-size="10.5" letter-spacing="1" fill="#ff6b35" text-anchor="middle" font-weight="700">CAPTAIN</text>
  <text x="380" y="115" font-size="12" fill="#888">AI assistant — voice, memory, identity, proactive</text>
  <text x="904" y="114" font-size="11" letter-spacing="1" fill="#22c55e" text-anchor="end" font-weight="700" filter="url(#glow3)">● SAILING</text>

  <!-- Ship 2: CRYPTO-TRADING -->
  <circle class="dot" cx="44" cy="162" r="5" fill="#ef4444" style="animation-delay:-.3s"/>
  <text x="60" y="167" font-size="14" letter-spacing="2" fill="#ffffff" font-weight="bold">CRYPTO-TRADING</text>
  <rect x="228" y="150" width="84" height="22" rx="11" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="270" y="166" font-size="10.5" letter-spacing="1" fill="#ef4444" text-anchor="middle" font-weight="700">WARSHIP</text>
  <text x="380" y="165" font-size="12" fill="#888">Multi-exchange spot/futures execution</text>
  <text x="904" y="164" font-size="11" letter-spacing="1" fill="#ef4444" text-anchor="end" font-weight="700">⚓ CLASSIFIED</text>

  <!-- Ship 3: CRYPTO-ALPHA -->
  <circle class="dot" cx="44" cy="212" r="5" fill="#ef4444" style="animation-delay:-.6s"/>
  <text x="60" y="217" font-size="14" letter-spacing="2" fill="#ffffff" font-weight="bold">CRYPTO-ALPHA</text>
  <rect x="228" y="200" width="84" height="22" rx="11" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="270" y="216" font-size="10.5" letter-spacing="1" fill="#ef4444" text-anchor="middle" font-weight="700">STEALTH</text>
  <text x="380" y="215" font-size="12" fill="#888">Alpha signals across DeFi and CEX markets</text>
  <text x="904" y="214" font-size="11" letter-spacing="1" fill="#ef4444" text-anchor="end" font-weight="700">⚓ CLASSIFIED</text>

  <!-- Ship 4: NASH-AGENT -->
  <circle class="dot" cx="44" cy="262" r="5" fill="#22c55e" style="animation-delay:-.9s"/>
  <text x="60" y="267" font-size="14" letter-spacing="2" fill="#ffffff" font-weight="bold">NASH-AGENT</text>
  <rect x="228" y="250" width="84" height="22" rx="11" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="270" y="266" font-size="10.5" letter-spacing="1" fill="#3b82f6" text-anchor="middle" font-weight="700">STRATEGIST</text>
  <text x="380" y="265" font-size="12" fill="#888">9-stage game-theoretic decision loop</text>
  <text x="904" y="264" font-size="11" letter-spacing="1" fill="#22c55e" text-anchor="end" font-weight="700" filter="url(#glow3)">● SAILING</text>

  <!-- Ship 5: CBW-RADAR -->
  <circle class="dot" cx="44" cy="312" r="5" fill="#22c55e" style="animation-delay:-1.2s"/>
  <text x="60" y="317" font-size="14" letter-spacing="2" fill="#ffffff" font-weight="bold">CBW-RADAR</text>
  <rect x="228" y="300" width="84" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="270" y="316" font-size="10.5" letter-spacing="1" fill="#22c55e" text-anchor="middle" font-weight="700">LOOKOUT</text>
  <text x="380" y="315" font-size="12" fill="#888">Volume scanner, 28 pairs, 67.7% WR backtest</text>
  <text x="904" y="314" font-size="11" letter-spacing="1" fill="#22c55e" text-anchor="end" font-weight="700" filter="url(#glow3)">● DEPLOYED</text>

  <!-- Ship 6: MEMPOOL-SCALPER -->
  <circle class="dot" cx="44" cy="362" r="5" fill="#f59e0b" style="animation-delay:-1.5s"/>
  <text x="60" y="367" font-size="14" letter-spacing="2" fill="#ffffff" font-weight="bold">MEMPOOL-SCALPER</text>
  <rect x="228" y="350" width="84" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="270" y="366" font-size="10.5" letter-spacing="1" fill="#f59e0b" text-anchor="middle" font-weight="700">RAIDER</text>
  <text x="380" y="365" font-size="12" fill="#888">Mempool sniping and MEV detection</text>
  <text x="904" y="364" font-size="11" letter-spacing="1" fill="#f59e0b" text-anchor="end" font-weight="700">⚒ BUILDING</text>

  <!-- Ship 7: WIFI-3D-MAPPER -->
  <circle class="dot" cx="44" cy="412" r="5" fill="#22c55e" style="animation-delay:-1.8s"/>
  <text x="60" y="417" font-size="14" letter-spacing="2" fill="#ffffff" font-weight="bold">WIFI-3D-MAPPER</text>
  <rect x="228" y="400" width="84" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4"/>
  <text x="270" y="416" font-size="10.5" letter-spacing="1" fill="#8b5cf6" text-anchor="middle" font-weight="700">SCOUT</text>
  <text x="380" y="415" font-size="12" fill="#888">WiFi-based 3D spatial human detection</text>
  <text x="904" y="414" font-size="11" letter-spacing="1" fill="#22c55e" text-anchor="end" font-weight="700" filter="url(#glow3)">● SAILING</text>

  <!-- Ship 8: CEYLONGEMS -->
  <circle class="dot" cx="44" cy="462" r="5" fill="#22c55e" style="animation-delay:-2.1s"/>
  <text x="60" y="467" font-size="14" letter-spacing="2" fill="#ffffff" font-weight="bold">CEYLONGEMS</text>
  <rect x="228" y="450" width="84" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="270" y="466" font-size="10.5" letter-spacing="1" fill="#10b981" text-anchor="middle" font-weight="700">TRADER</text>
  <text x="380" y="465" font-size="12" fill="#888">Sri Lankan gemstone marketplace — e-commerce</text>
  <text x="904" y="464" font-size="11" letter-spacing="1" fill="#22c55e" text-anchor="end" font-weight="700" filter="url(#glow3)">● DOCKED</text>

  <!-- Ship 9: SOFTWARE-FACTORY -->
  <circle class="dot" cx="44" cy="512" r="5" fill="#22c55e" style="animation-delay:-2.4s"/>
  <text x="60" y="517" font-size="14" letter-spacing="2" fill="#ffffff" font-weight="bold">SOFTWARE-FACTORY</text>
  <rect x="228" y="500" width="84" height="22" rx="11" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="270" y="516" font-size="10.5" letter-spacing="1" fill="#3b82f6" text-anchor="middle" font-weight="700">SHIPWRIGHT</text>
  <text x="380" y="515" font-size="12" fill="#888">Plans in, PRs out — software that builds software</text>
  <text x="904" y="514" font-size="11" letter-spacing="1" fill="#22c55e" text-anchor="end" font-weight="700" filter="url(#glow3)">● SAILING</text>

  <!-- Ship 10: JARVIS-IDENTITY -->
  <circle class="dot" cx="44" cy="562" r="5" fill="#22c55e" style="animation-delay:-2.7s"/>
  <text x="60" y="567" font-size="14" letter-spacing="2" fill="#ffffff" font-weight="bold">JARVIS-IDENTITY</text>
  <rect x="228" y="550" width="84" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4"/>
  <text x="270" y="566" font-size="10.5" letter-spacing="1" fill="#8b5cf6" text-anchor="middle" font-weight="700">HELMSMAN</text>
  <text x="380" y="565" font-size="12" fill="#888">Voice profiles, identity persistence, persona engine</text>
  <text x="904" y="564" font-size="11" letter-spacing="1" fill="#22c55e" text-anchor="end" font-weight="700" filter="url(#glow3)">● SAILING</text>

  <!-- Bottom quote -->
  <line x1="36" y1="590" x2="904" y2="590" stroke="#222" stroke-width="1"/>
  <text x="470" y="610" font-size="11" fill="#444" text-anchor="middle" font-style="italic">"I don't want to conquer anything. I just think the guy with the most freedom is the Pirate King."</text>
</svg>
