<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-label="fleet — project roster">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&amp;display=swap');</style>
  </defs>
  <style>
    text{font-family:'Lato',sans-serif}
    @keyframes fadeRow{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    .r1{animation:fadeRow .4s ease-out both}
    .r2{animation:fadeRow .4s ease-out .08s both}
    .r3{animation:fadeRow .4s ease-out .16s both}
    .r4{animation:fadeRow .4s ease-out .24s both}
    .r5{animation:fadeRow .4s ease-out .32s both}
    .r6{animation:fadeRow .4s ease-out .4s both}
    .r7{animation:fadeRow .4s ease-out .48s both}
    .r8{animation:fadeRow .4s ease-out .56s both}
    .r9{animation:fadeRow .4s ease-out .64s both}
    @keyframes dotPulse{0%,100%{opacity:.5}50%{opacity:1}}
    .dp{animation:dotPulse 2.5s ease-in-out infinite}
  </style>

  <rect width="940" height="520" fill="#fffef9" rx="12"/>

  <!-- Header -->
  <text x="36" y="36" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">FLEET — PROJECT ROSTER</text>
  <text x="904" y="36" font-size="10" fill="#cbd5e1" text-anchor="end">9 active</text>
  <line x1="36" y1="48" x2="904" y2="48" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Columns -->
  <text x="52" y="72" font-size="9" font-weight="700" fill="#cbd5e1" letter-spacing="2">PROJECT</text>
  <text x="280" y="72" font-size="9" font-weight="700" fill="#cbd5e1" letter-spacing="2" text-anchor="middle">ROLE</text>
  <text x="380" y="72" font-size="9" font-weight="700" fill="#cbd5e1" letter-spacing="2">DESCRIPTION</text>
  <text x="904" y="72" font-size="9" font-weight="700" fill="#cbd5e1" letter-spacing="2" text-anchor="end">STATUS</text>
  <line x1="36" y1="82" x2="904" y2="82" stroke="#f8fafc" stroke-width="1"/>

  <!-- Row 1: JARVIS -->
  <g class="r1">
    <circle class="dp" cx="44" cy="104" r="3" fill="#22c55e"/>
    <text x="58" y="108" font-size="13" font-weight="700" fill="#1e293b">JARVIS</text>
    <rect x="240" y="92" width="80" height="20" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="280" y="106" font-size="10" fill="#64748b" text-anchor="middle">captain</text>
    <text x="380" y="107" font-size="12" fill="#94a3b8">AI assistant — voice, memory, identity</text>
    <text x="904" y="106" font-size="10" fill="#16a34a" text-anchor="end" font-weight="700">sailing</text>
  </g>
  <line x1="36" y1="122" x2="904" y2="122" stroke="#f8fafc" stroke-width="0.5"/>

  <!-- Row 2 -->
  <g class="r2">
    <circle class="dp" cx="44" cy="144" r="3" fill="#ef4444" style="animation-delay:-.3s"/>
    <text x="58" y="148" font-size="13" font-weight="700" fill="#1e293b">CRYPTO-TRADING</text>
    <rect x="240" y="132" width="80" height="20" rx="10" fill="none" stroke="#fecaca" stroke-width="1"/>
    <text x="280" y="146" font-size="10" fill="#ef4444" text-anchor="middle">warship</text>
    <text x="380" y="147" font-size="12" fill="#94a3b8">Multi-exchange spot/futures execution</text>
    <text x="904" y="146" font-size="10" fill="#dc2626" text-anchor="end" font-weight="700">classified</text>
  </g>
  <line x1="36" y1="162" x2="904" y2="162" stroke="#f8fafc" stroke-width="0.5"/>

  <!-- Row 3 -->
  <g class="r3">
    <circle class="dp" cx="44" cy="184" r="3" fill="#ef4444" style="animation-delay:-.6s"/>
    <text x="58" y="188" font-size="13" font-weight="700" fill="#1e293b">CRYPTO-ALPHA</text>
    <rect x="240" y="172" width="80" height="20" rx="10" fill="none" stroke="#fecaca" stroke-width="1"/>
    <text x="280" y="186" font-size="10" fill="#ef4444" text-anchor="middle">stealth</text>
    <text x="380" y="187" font-size="12" fill="#94a3b8">Alpha signals across DeFi and CEX markets</text>
    <text x="904" y="186" font-size="10" fill="#dc2626" text-anchor="end" font-weight="700">classified</text>
  </g>
  <line x1="36" y1="202" x2="904" y2="202" stroke="#f8fafc" stroke-width="0.5"/>

  <!-- Row 4 -->
  <g class="r4">
    <circle class="dp" cx="44" cy="224" r="3" fill="#22c55e" style="animation-delay:-.9s"/>
    <text x="58" y="228" font-size="13" font-weight="700" fill="#1e293b">NASH-AGENT</text>
    <rect x="240" y="212" width="80" height="20" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="280" y="226" font-size="10" fill="#64748b" text-anchor="middle">strategist</text>
    <text x="380" y="227" font-size="12" fill="#94a3b8">9-stage game-theoretic decision loop</text>
    <text x="904" y="226" font-size="10" fill="#16a34a" text-anchor="end" font-weight="700">sailing</text>
  </g>
  <line x1="36" y1="242" x2="904" y2="242" stroke="#f8fafc" stroke-width="0.5"/>

  <!-- Row 5 -->
  <g class="r5">
    <circle class="dp" cx="44" cy="264" r="3" fill="#22c55e" style="animation-delay:-1.2s"/>
    <text x="58" y="268" font-size="13" font-weight="700" fill="#1e293b">CBW-RADAR</text>
    <rect x="240" y="252" width="80" height="20" rx="10" fill="none" stroke="#bbf7d0" stroke-width="1"/>
    <text x="280" y="266" font-size="10" fill="#16a34a" text-anchor="middle">lookout</text>
    <text x="380" y="267" font-size="12" fill="#94a3b8">Volume scanner, 28 pairs, 67.7% WR backtest</text>
    <text x="904" y="266" font-size="10" fill="#16a34a" text-anchor="end" font-weight="700">deployed</text>
  </g>
  <line x1="36" y1="282" x2="904" y2="282" stroke="#f8fafc" stroke-width="0.5"/>

  <!-- Row 6 -->
  <g class="r6">
    <circle class="dp" cx="44" cy="304" r="3" fill="#f59e0b" style="animation-delay:-1.5s"/>
    <text x="58" y="308" font-size="13" font-weight="700" fill="#1e293b">MEMPOOL-SCALPER</text>
    <rect x="240" y="292" width="80" height="20" rx="10" fill="none" stroke="#fef3c7" stroke-width="1"/>
    <text x="280" y="306" font-size="10" fill="#d97706" text-anchor="middle">raider</text>
    <text x="380" y="307" font-size="12" fill="#94a3b8">Mempool sniping and MEV detection</text>
    <text x="904" y="306" font-size="10" fill="#d97706" text-anchor="end" font-weight="700">building</text>
  </g>
  <line x1="36" y1="322" x2="904" y2="322" stroke="#f8fafc" stroke-width="0.5"/>

  <!-- Row 7 -->
  <g class="r7">
    <circle class="dp" cx="44" cy="344" r="3" fill="#22c55e" style="animation-delay:-1.8s"/>
    <text x="58" y="348" font-size="13" font-weight="700" fill="#1e293b">WIFI-3D-MAPPER</text>
    <rect x="240" y="332" width="80" height="20" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="280" y="346" font-size="10" fill="#64748b" text-anchor="middle">scout</text>
    <text x="380" y="347" font-size="12" fill="#94a3b8">WiFi-based 3D spatial human detection</text>
    <text x="904" y="346" font-size="10" fill="#16a34a" text-anchor="end" font-weight="700">sailing</text>
  </g>
  <line x1="36" y1="362" x2="904" y2="362" stroke="#f8fafc" stroke-width="0.5"/>

  <!-- Row 8 -->
  <g class="r8">
    <circle class="dp" cx="44" cy="384" r="3" fill="#22c55e" style="animation-delay:-2.1s"/>
    <text x="58" y="388" font-size="13" font-weight="700" fill="#1e293b">CEYLONGEMS</text>
    <rect x="240" y="372" width="80" height="20" rx="10" fill="none" stroke="#bbf7d0" stroke-width="1"/>
    <text x="280" y="386" font-size="10" fill="#16a34a" text-anchor="middle">trader</text>
    <text x="380" y="387" font-size="12" fill="#94a3b8">Sri Lankan gemstone marketplace — e-commerce</text>
    <text x="904" y="386" font-size="10" fill="#16a34a" text-anchor="end" font-weight="700">docked</text>
  </g>
  <line x1="36" y1="402" x2="904" y2="402" stroke="#f8fafc" stroke-width="0.5"/>

  <!-- Row 9 -->
  <g class="r9">
    <circle class="dp" cx="44" cy="424" r="3" fill="#22c55e" style="animation-delay:-2.4s"/>
    <text x="58" y="428" font-size="13" font-weight="700" fill="#1e293b">SOFTWARE-FACTORY</text>
    <rect x="240" y="412" width="80" height="20" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="280" y="426" font-size="10" fill="#64748b" text-anchor="middle">shipwright</text>
    <text x="380" y="427" font-size="12" fill="#94a3b8">Plans in, PRs out — software that builds software</text>
    <text x="904" y="426" font-size="10" fill="#16a34a" text-anchor="end" font-weight="700">sailing</text>
  </g>

  <!-- Footer -->
  <line x1="36" y1="455" x2="904" y2="455" stroke="#f1f5f9" stroke-width="1"/>
  <text x="470" y="485" font-size="11" fill="#cbd5e1" text-anchor="middle" font-style="italic">"If you don't take risks, you can't create a future." — Monkey D. Luffy</text>
</svg>
