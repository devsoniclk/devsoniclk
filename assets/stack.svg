<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 140" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="devil fruit powers — tech stack">
  <defs>
    <linearGradient id="dfg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4444"/>
      <stop offset="1" stop-color="#ffa500"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes glow{0%,100%{filter:drop-shadow(0 0 2px rgba(255,100,50,.3))}50%{filter:drop-shadow(0 0 8px rgba(255,100,50,.6))}}
    .fruit{animation:glow 3s ease-in-out infinite}
  </style>

  <!-- Panel -->
  <rect x="1" y="1" width="938" height="138" rx="14" fill="#111" stroke="#ff4444" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Header -->
  <text x="36" y="36" font-size="14" letter-spacing="3" fill="#ff6b35" font-weight="bold">🍎 DEVIL FRUIT POWERS</text>

  <!-- Row 1 -->
  <g class="fruit" style="animation-delay:0s">
    <rect x="36"  y="50" width="80"  height="26" rx="13" fill="none" stroke="#ff4444" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="76"  y="67" font-size="11" fill="#ffa500" text-anchor="middle" font-weight="700">Python</text>
  </g>
  <g class="fruit" style="animation-delay:0.2s">
    <rect x="124" y="50" width="98"  height="26" rx="13" fill="none" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="173" y="67" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="700">TypeScript</text>
  </g>
  <g class="fruit" style="animation-delay:0.4s">
    <rect x="230" y="50" width="98"  height="26" rx="13" fill="none" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="279" y="67" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="700">JavaScript</text>
  </g>
  <g class="fruit" style="animation-delay:0.6s">
    <rect x="336" y="50" width="76"  height="26" rx="13" fill="none" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="374" y="67" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">FastAPI</text>
  </g>
  <g class="fruit" style="animation-delay:0.8s">
    <rect x="420" y="50" width="80"  height="26" rx="13" fill="none" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="460" y="67" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">Node.js</text>
  </g>
  <g class="fruit" style="animation-delay:1s">
    <rect x="508" y="50" width="68"  height="26" rx="13" fill="none" stroke="#61dafb" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="542" y="67" font-size="11" fill="#61dafb" text-anchor="middle" font-weight="700">React</text>
  </g>
  <g class="fruit" style="animation-delay:1.2s">
    <rect x="584" y="50" width="86"  height="26" rx="13" fill="none" stroke="#3ecf8e" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="627" y="67" font-size="11" fill="#3ecf8e" text-anchor="middle" font-weight="700">Supabase</text>
  </g>
  <g class="fruit" style="animation-delay:1.4s">
    <rect x="678" y="50" width="72"  height="26" rx="13" fill="none" stroke="#2496ed" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="714" y="67" font-size="11" fill="#5bb3f0" text-anchor="middle" font-weight="700">Docker</text>
  </g>
  <g class="fruit" style="animation-delay:1.6s">
    <rect x="758" y="50" width="68"  height="26" rx="13" fill="none" stroke="#0f7b6c" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="792" y="67" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="700">SQLite</text>
  </g>
  <g class="fruit" style="animation-delay:1.8s">
    <rect x="834" y="50" width="68"  height="26" rx="13" fill="none" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="868" y="67" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="700">Linux</text>
  </g>

  <!-- Row 2 -->
  <g class="fruit" style="animation-delay:2s">
    <rect x="36"  y="84" width="76"  height="26" rx="13" fill="none" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="74"  y="101" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="700">Binance</text>
  </g>
  <g class="fruit" style="animation-delay:2.2s">
    <rect x="120" y="84" width="82"  height="26" rx="13" fill="none" stroke="#26a5e4" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="161" y="101" font-size="11" fill="#5bb3f0" text-anchor="middle" font-weight="700">Telegram</text>
  </g>
  <g class="fruit" style="animation-delay:2.4s">
    <rect x="210" y="84" width="62"  height="26" rx="13" fill="none" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="241" y="101" font-size="11" fill="#f87171" text-anchor="middle" font-weight="700">Fly.io</text>
  </g>

  <!-- Bottom -->
  <text x="36" y="130" font-size="11" fill="#444" font-style="italic">"Power isn't determined by your size, but the size of your heart and dreams!" — Monkey D. Luffy</text>
</svg>
