<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 100" role="img" aria-label="tech stack">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&amp;display=swap');</style>
  </defs>
  <style>
    text{font-family:'Lato',sans-serif}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .b{animation:fadeUp .4s ease-out both}
    @keyframes softGlow{0%,100%{box-shadow:none}50%{filter:drop-shadow(0 0 4px rgba(217,119,6,.1))}}
  </style>

  <rect width="940" height="100" fill="#fffef9" rx="12"/>

  <text x="36" y="30" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">TECH STACK</text>

  <!-- Row 1 -->
  <g class="b" style="animation-delay:0s"><rect x="36" y="42" width="66" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="69" y="58" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Python</text></g>
  <g class="b" style="animation-delay:.05s"><rect x="110" y="42" width="82" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="151" y="58" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">TypeScript</text></g>
  <g class="b" style="animation-delay:.1s"><rect x="200" y="42" width="82" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="241" y="58" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">JavaScript</text></g>
  <g class="b" style="animation-delay:.15s"><rect x="290" y="42" width="62" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="321" y="58" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">FastAPI</text></g>
  <g class="b" style="animation-delay:.2s"><rect x="360" y="42" width="66" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="393" y="58" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Node.js</text></g>
  <g class="b" style="animation-delay:.25s"><rect x="434" y="42" width="56" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="462" y="58" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">React</text></g>
  <g class="b" style="animation-delay:.3s"><rect x="498" y="42" width="72" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="534" y="58" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Supabase</text></g>
  <g class="b" style="animation-delay:.35s"><rect x="578" y="42" width="58" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="607" y="58" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Docker</text></g>
  <g class="b" style="animation-delay:.4s"><rect x="644" y="42" width="54" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="671" y="58" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">SQLite</text></g>
  <g class="b" style="animation-delay:.45s"><rect x="706" y="42" width="50" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="731" y="58" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Linux</text></g>

  <!-- Row 2 -->
  <g class="b" style="animation-delay:.5s"><rect x="36" y="72" width="60" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="66" y="88" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Binance</text></g>
  <g class="b" style="animation-delay:.55s"><rect x="104" y="72" width="68" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="138" y="88" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Telegram</text></g>
  <g class="b" style="animation-delay:.6s"><rect x="180" y="72" width="48" height="24" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="204" y="88" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Fly.io</text></g>
</svg>
