<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Lakshitha Dananjaya — autonomous systems">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <clipPath id="typeclip"><rect x="64" y="196" width="0" height="26">
      <animate attributeName="width" calcMode="discrete" fill="freeze" begin="0.8s" dur="3.6s"
        values="0;18;36;54;72;90;108;126;144;162;180;198;216;234;252;270;288;306;324;342;360;378;396;414;432;450;468;486;504;522;540;558;576;594;612;630;648;666;684;702;720;738;756;774;792;810;828;846;864"/>
    </rect></clipPath>
    <clipPath id="subclip"><rect x="64" y="228" width="0" height="18">
      <animate attributeName="width" calcMode="discrete" fill="freeze" begin="4.8s" dur="4.2s"
        values="0;11;22;33;44;55;66;77;88;99;110;121;132;143;154;165;176;187;198;209;220;231;242;253;264;275;286;297;308;319;330;341;352;363;374;385;396;407;418;429;440;451;462;473;484;495;506;517;528;539;550;561;572;583;594;605;616;627;638;649;660;671;682;693;704;715;726;737;748"/>
    </rect></clipPath>
  </defs>
  <style>
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
    .s{fill:#94a3b8;animation:tw 4s ease-in-out infinite}
    @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .fi{animation:fadein .8s ease-out both}
  </style>

  <!-- Background -->
  <rect width="960" height="320" fill="url(#sky)" rx="16"/>

  <!-- Grid dots -->
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.8" fill="#cbd5e1" opacity="0.5"/>
  </pattern>
  <rect width="960" height="320" fill="url(#dots)" rx="16"/>

  <!-- Decorative stars -->
  <circle class="s" cx="180" cy="45" r="1.5" style="animation-delay:0s"/>
  <circle class="s" cx="320" cy="30" r="1" style="animation-delay:1.2s"/>
  <circle class="s" cx="500" cy="55" r="1.5" style="animation-delay:2.1s"/>
  <circle class="s" cx="680" cy="35" r="1" style="animation-delay:0.7s"/>
  <circle class="s" cx="820" cy="50" r="1.5" style="animation-delay:3.3s"/>
  <circle class="s" cx="420" cy="70" r="1" style="animation-delay:1.8s"/>
  <circle class="s" cx="750" cy="65" r="1" style="animation-delay:2.6s"/>

  <!-- Accent line -->
  <line x1="64" y1="160" x2="280" y2="160" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="fi"/>

  <!-- ASCII Art Header -->
  <g class="fi" style="animation-delay:0.2s">
    <text x="64" y="110" font-size="11" fill="#0ea5e9" letter-spacing="0.5" opacity="0.9">
      <tspan x="64" dy="0">██╗      █████╗ ██╗  ██╗███████╗██╗  ██╗██╗████████╗██╗  ██╗ █████╗</tspan>
      <tspan x="64" dy="13">██║     ██╔══██╗██║ ██╔╝██╔════╝██║  ██║██║╚══██╔══╝██║  ██║██╔══██╗</tspan>
      <tspan x="64" dy="13">██║     ███████║█████╔╝ ███████╗███████║██║   ██║   ███████║███████║</tspan>
      <tspan x="64" dy="13">██║     ██╔══██║██╔═██╗ ╚════██║██╔══██║██║   ██║   ██╔══██║██╔══██║</tspan>
      <tspan x="64" dy="13">███████╗██║  ██║██║  ██╗███████║██║  ██║██║   ██║   ██║  ██║██║  ██║</tspan>
      <tspan x="64" dy="13">╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝╚═╝   ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═╝</tspan>
    </text>
  </g>

  <!-- Typewriter name -->
  <g clip-path="url(#typeclip)">
    <text x="64" y="214" font-size="20" fill="#0f172a" letter-spacing="12" font-weight="bold">d a n a n j a y a</text>
  </g>

  <!-- Subtitle typewriter -->
  <g clip-path="url(#subclip)">
    <text x="64" y="244" font-size="14" fill="#64748b" letter-spacing="1">autonomous systems · crypto infrastructure · adversarial security</text>
  </g>

  <!-- Tagline -->
  <g class="fi" style="animation-delay:9s">
    <text x="64" y="278" font-size="13" fill="#94a3b8" font-style="italic">Inspiration is where you find it!</text>
  </g>

  <!-- Decorative accent dot -->
  <circle cx="900" cy="280" r="24" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="900" cy="280" r="12" fill="#0ea5e9" opacity="0.15"/>
  <circle cx="900" cy="280" r="4" fill="#0ea5e9" opacity="0.4"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="316" width="960" height="4" fill="url(#accent)" rx="2"/>
</svg>
