<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="devsoniclk — autonomous systems">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&amp;display=swap');</style>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Lato',sans-serif}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fadeUp .8s ease-out both}
    .f2{animation:fadeUp .8s ease-out .3s both}
    .f3{animation:fadeUp .8s ease-out .6s both}
    .f4{animation:fadeUp .8s ease-out .9s both}
    .f5{animation:fadeUp .8s ease-out 1.2s both}
    @keyframes drawLine{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
    .line{stroke-dasharray:200;animation:drawLine 1.5s ease-out both}
    @keyframes softPulse{0%,100%{opacity:.6}50%{opacity:1}}
    .pulse{animation:softPulse 3s ease-in-out infinite}
  </style>

  <rect width="960" height="280" fill="#fffef9" rx="12"/>

  <!-- Straw hat — minimal line art -->
  <g class="f1" transform="translate(480, 72)" opacity="0.12">
    <ellipse cx="0" cy="10" rx="44" ry="10" fill="none" stroke="#92400e" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="24" ry="20" fill="none" stroke="#92400e" stroke-width="1.5"/>
    <rect x="-22" y="4" width="44" height="4" rx="2" fill="#dc2626" opacity="0.5"/>
  </g>

  <!-- Name -->
  <text class="f2" x="480" y="130" text-anchor="middle" font-size="42" font-weight="900" fill="#1e293b" letter-spacing="10">devsoniclk</text>

  <!-- Accent line -->
  <line class="line f3" x1="380" y1="148" x2="580" y2="148" stroke="url(#line)" stroke-width="1.5"/>

  <!-- Tagline -->
  <text class="f4" x="480" y="178" text-anchor="middle" font-size="14" font-weight="300" fill="#94a3b8" letter-spacing="4">autonomous systems · crypto infrastructure · adversarial security</text>

  <!-- Quote -->
  <text class="f5" x="480" y="220" text-anchor="middle" font-size="12" fill="#cbd5e1" font-style="italic">"I'm gonna be the King of the Pirates!" — Monkey D. Luffy</text>

  <!-- Bottom line -->
  <line class="pulse" x1="0" y1="276" x2="960" y2="276" stroke="#d97706" stroke-width="1" opacity="0.15"/>
</svg>
