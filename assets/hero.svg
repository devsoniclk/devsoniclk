<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="devsoniclk — autonomous systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <clipPath id="typeclip"><rect x="64" y="210" width="0" height="26">
      <animate attributeName="width" calcMode="discrete" fill="freeze" begin="0.8s" dur="2.8s"
        values="0;22;44;66;88;110;132;154;176;198;220;242;264;286;308;330;352;374;396"/>
    </rect></clipPath>
  </defs>
  <style>
    @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fi{animation:fadein .8s ease-out both}
  </style>

  <!-- Clean background -->
  <rect width="960" height="300" fill="url(#bg)" rx="16"/>
  <rect x="0" y="296" width="960" height="4" fill="#0ea5e9" rx="2"/>

  <!-- ASCII Art — high contrast dark blue -->
  <g class="fi" style="animation-delay:0.2s">
    <text x="64" y="48" font-size="12.5" fill="#0c4a6e" letter-spacing="0.5">
      <tspan x="64" dy="0">██████╗ ███████╗██╗   ██╗███████╗ ██████╗ ███╗   ██╗██╗ ██████╗██╗     ██╗  ██╗</tspan>
      <tspan x="64" dy="14">██╔══██╗██╔════╝██║   ██║██╔════╝██╔═══██╗████╗  ██║██║██╔════╝██║     ██║ ██╔╝</tspan>
      <tspan x="64" dy="14">██║  ██║█████╗  ██║   ██║███████╗██║   ██║██╔██╗ ██║██║██║     ██║     █████╔╝ </tspan>
      <tspan x="64" dy="14">██║  ██║██╔══╝  ╚██╗ ██╔╝╚════██║██║   ██║██║╚██╗██║██║██║     ██║     ██╔═██╗ </tspan>
      <tspan x="64" dy="14">██████╔╝███████╗ ╚████╔╝ ███████║╚██████╔╝██║ ╚████║██║╚██████╗███████╗██║  ██╗</tspan>
      <tspan x="64" dy="14">╚═════╝ ╚══════╝  ╚═══╝  ╚══════╝ ╚═════╝ ╚═╝  ╚═══╝╚═╝ ╚═════╝╚══════╝╚═╝  ╚═╝</tspan>
    </text>
  </g>

  <!-- Thin accent line -->
  <line x1="64" y1="148" x2="200" y2="148" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" class="fi" style="animation-delay:0.6s"/>

  <!-- Typewriter name -->
  <g clip-path="url(#typeclip)">
    <text x="64" y="230" font-size="22" fill="#0f172a" letter-spacing="14" font-weight="bold">d e v s o n i c l k</text>
  </g>

  <!-- Subtitle -->
  <g class="fi" style="animation-delay:4s">
    <text x="64" y="260" font-size="14" fill="#64748b" letter-spacing="1">autonomous systems · crypto infrastructure · adversarial security</text>
  </g>

  <!-- Tagline -->
  <g class="fi" style="animation-delay:5s">
    <text x="64" y="285" font-size="13" fill="#94a3b8" font-style="italic">Inspiration is where you find it!</text>
  </g>
</svg>
