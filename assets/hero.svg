<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="devsoniclk — the king of the pirates">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.5" stop-color="#1a0a0a"/>
      <stop offset="1" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4444"/>
      <stop offset="0.5" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#ffa500"/>
    </linearGradient>
    <radialGradient id="gear5glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff5e6" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ff6b35" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ff4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeclip"><rect x="64" y="250" width="0" height="30">
      <animate attributeName="width" calcMode="discrete" fill="freeze" begin="1.2s" dur="2.4s"
        values="0;24;48;72;96;120;144;168;192;216;240;264;288;312;336;360;384;408;432"/>
    </rect></clipPath>
    <clipPath id="subclip"><rect x="64" y="285" width="0" height="18">
      <animate attributeName="width" calcMode="discrete" fill="freeze" begin="4s" dur="3.6s"
        values="0;11;22;33;44;55;66;77;88;99;110;121;132;143;154;165;176;187;198;209;220;231;242;253;264;275;286;297;308;319;330;341;352;363;374;385;396;407;418;429;440;451;462;473;484;495;506;517;528;539;550;561;572;583;594;605;616;627;638;649;660;671;682"/>
    </rect></clipPath>
  </defs>
  <style>
    @keyframes gear5pulse{0%,100%{opacity:.06;transform:scale(1)}50%{opacity:.15;transform:scale(1.05)}}
    .g5{animation:gear5pulse 4s ease-in-out infinite}
    @keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(960px)}}
    .cloud{animation:drift 25s linear infinite}
    .cloud2{animation:drift 35s linear infinite;animation-delay:-12s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .star{fill:#ffa500;animation:tw 3s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .float{animation:float 3s ease-in-out infinite}
    @keyframes flicker{0%,100%{opacity:1}50%{opacity:.7}}
    .fire{animation:flicker 0.3s ease-in-out infinite alternate}
  </style>

  <!-- Background -->
  <rect width="960" height="360" fill="url(#bg)" rx="16"/>

  <!-- Gear 5 aura -->
  <ellipse class="g5" cx="480" cy="180" rx="400" ry="180" fill="url(#gear5glow)"/>

  <!-- Animated clouds (Gear 5 style) -->
  <g class="cloud" opacity="0.08">
    <ellipse cx="0" cy="80" rx="80" ry="25" fill="#fff5e6"/>
    <ellipse cx="30" cy="70" rx="50" ry="20" fill="#fff5e6"/>
  </g>
  <g class="cloud2" opacity="0.06">
    <ellipse cx="0" cy="280" rx="60" ry="18" fill="#fff5e6"/>
    <ellipse cx="20" cy="272" rx="40" ry="14" fill="#fff5e6"/>
  </g>

  <!-- Stars -->
  <circle class="star" cx="150" cy="40" r="1.5" style="animation-delay:0s"/>
  <circle class="star" cx="300" cy="25" r="1" style="animation-delay:0.8s"/>
  <circle class="star" cx="500" cy="50" r="1.5" style="animation-delay:1.5s"/>
  <circle class="star" cx="700" cy="30" r="1" style="animation-delay:2.2s"/>
  <circle class="star" cx="850" cy="45" r="1.5" style="animation-delay:0.4s"/>
  <circle class="star" cx="200" cy="320" r="1" style="animation-delay:1.8s"/>
  <circle class="star" cx="750" cy="330" r="1.5" style="animation-delay:3s"/>

  <!-- Straw Hat icon -->
  <g class="float" transform="translate(860, 40)">
    <ellipse cx="0" cy="8" rx="28" ry="8" fill="#ffa500" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="16" ry="14" fill="#ffd700" opacity="0.9"/>
    <rect x="-15" y="6" width="30" height="3" rx="1.5" fill="#dc2626" opacity="0.8"/>
  </g>

  <!-- ASCII Art DEVSONICLK with fire glow -->
  <g filter="url(#glow)">
    <text x="64" y="50" font-size="12.5" fill="url(#fire)" letter-spacing="0.5">
      <tspan x="64" dy="0">██████╗ ███████╗██╗   ██╗███████╗ ██████╗ ███╗   ██╗██╗ ██████╗██╗     ██╗  ██╗</tspan>
      <tspan x="64" dy="14">██╔══██╗██╔════╝██║   ██║██╔════╝██╔═══██╗████╗  ██║██║██╔════╝██║     ██║ ██╔╝</tspan>
      <tspan x="64" dy="14">██║  ██║█████╗  ██║   ██║███████╗██║   ██║██╔██╗ ██║██║██║     ██║     █████╔╝ </tspan>
      <tspan x="64" dy="14">██║  ██║██╔══╝  ╚██╗ ██╔╝╚════██║██║   ██║██║╚██╗██║██║██║     ██║     ██╔═██╗ </tspan>
      <tspan x="64" dy="14">██████╔╝███████╗ ╚████╔╝ ███████║╚██████╔╝██║ ╚████║██║╚██████╗███████╗██║  ██╗</tspan>
      <tspan x="64" dy="14">╚═════╝ ╚══════╝  ╚═══╝  ╚══════╝ ╚═════╝ ╚═╝  ╚═══╝╚═╝ ╚═════╝╚══════╝╚═╝  ╚═╝</tspan>
    </text>
  </g>

  <!-- Accent line -->
  <rect x="64" y="150" width="180" height="3" rx="1.5" fill="url(#fire)" opacity="0.8"/>

  <!-- Gear 5 label -->
  <text x="64" y="185" font-size="11" letter-spacing="4" fill="#ff6b35" opacity="0.7">GEAR 5 // AUTONOMOUS SYSTEMS</text>

  <!-- Typewriter name -->
  <g clip-path="url(#typeclip)">
    <text x="64" y="275" font-size="24" fill="#ffffff" letter-spacing="14" font-weight="bold" filter="url(#glow)">d e v s o n i c l k</text>
  </g>

  <!-- Subtitle -->
  <g clip-path="url(#subclip)">
    <text x="64" y="302" font-size="13" fill="#888" letter-spacing="1">crypto infrastructure · autonomous agents · adversarial security</text>
  </g>

  <!-- Quote -->
  <g>
    <text x="64" y="340" font-size="12" fill="#555" font-style="italic">
      "I'm gonna be the King of the Pirates!" — Monkey D. Luffy
    </text>
  </g>

  <!-- Bottom fire bar -->
  <rect x="0" y="355" width="960" height="5" fill="url(#fire)" rx="2.5" class="fire" opacity="0.9"/>
</svg>
