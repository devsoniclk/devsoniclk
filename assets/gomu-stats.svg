<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 160" role="img" aria-label="power level stats">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&amp;display=swap');</style>
  </defs>
  <style>
    text{font-family:'Lato',sans-serif}
    @keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .c1{animation:countUp .5s ease-out both}
    .c2{animation:countUp .5s ease-out .15s both}
    .c3{animation:countUp .5s ease-out .3s both}
    .c4{animation:countUp .5s ease-out .45s both}
    .c5{animation:countUp .5s ease-out .6s both}
    @keyframes softGlow{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 6px rgba(217,119,6,.15))}}
    .glow{animation:softGlow 4s ease-in-out infinite}
  </style>

  <rect width="940" height="160" fill="#fffef9" rx="12"/>

  <!-- Divider dots -->
  <circle cx="180" cy="55" r="1.5" fill="#e2e8f0"/>
  <circle cx="180" cy="75" r="1.5" fill="#e2e8f0"/>
  <circle cx="180" cy="95" r="1.5" fill="#e2e8f0"/>
  <circle cx="360" cy="55" r="1.5" fill="#e2e8f0"/>
  <circle cx="360" cy="75" r="1.5" fill="#e2e8f0"/>
  <circle cx="360" cy="95" r="1.5" fill="#e2e8f0"/>
  <circle cx="500" cy="55" r="1.5" fill="#e2e8f0"/>
  <circle cx="500" cy="75" r="1.5" fill="#e2e8f0"/>
  <circle cx="500" cy="95" r="1.5" fill="#e2e8f0"/>

  <!-- REPOS -->
  <g class="c1">
    <text x="36" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">REPOS</text>
    <text x="36" y="92" font-size="38" font-weight="900" fill="#1e293b">19</text>
  </g>

  <!-- STARS -->
  <g class="c2">
    <text x="200" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">STARS</text>
    <text x="200" y="92" font-size="38" font-weight="900" fill="#1e293b">31</text>
  </g>

  <!-- LANGUAGES -->
  <g class="c3">
    <text x="380" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">LANGUAGES</text>
    <text x="380" y="92" font-size="38" font-weight="900" fill="#1e293b">5</text>
  </g>

  <!-- PRIMARY -->
  <g class="c4">
    <text x="520" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">PRIMARY</text>
    <text x="520" y="88" font-size="24" font-weight="700" fill="#d97706">Python</text>
  </g>

  <!-- LOCATION -->
  <g class="c5">
    <text x="680" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">LOCATION</text>
    <text x="680" y="88" font-size="24" font-weight="700" fill="#d97706">Sri Lanka</text>
  </g>

  <!-- Deployment row -->
  <g class="glow">
    <text x="36" y="135" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">DEPLOYMENTS</text>
    <rect x="150" y="120" width="60" height="22" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="180" y="135" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Fly.io</text>
    <rect x="218" y="120" width="74" height="22" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="255" y="135" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Supabase</text>
    <rect x="300" y="120" width="60" height="22" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="330" y="135" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Binance</text>
    <rect x="368" y="120" width="68" height="22" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="402" y="135" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Telegram</text>
  </g>

  <!-- Status -->
  <text x="880" y="135" font-size="11" fill="#94a3b8" text-anchor="end">all systems operational <tspan fill="#22c55e">●</tspan></text>
</svg>
