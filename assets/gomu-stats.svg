<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 120" role="img" aria-label="power level stats">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&amp;display=swap');</style>
  </defs>
  <style>
    text{font-family:'Lato',sans-serif}
    @keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .c1{animation:countUp .5s ease-out both}
    .c2{animation:countUp .5s ease-out .15s both}
    .c3{animation:countUp .5s ease-out .3s both}
    .c4{animation:countUp .5s ease-out .45s both}
    .c5{animation:countUp .5s ease-out .6s both}
    .c6{animation:countUp .5s ease-out .75s both}
  </style>

  <rect width="940" height="120" fill="#fffef9" rx="12"/>

  <!-- Divider dots -->
  <circle cx="165" cy="55" r="1.5" fill="#e2e8f0"/>
  <circle cx="165" cy="75" r="1.5" fill="#e2e8f0"/>
  <circle cx="165" cy="95" r="1.5" fill="#e2e8f0"/>
  <circle cx="310" cy="55" r="1.5" fill="#e2e8f0"/>
  <circle cx="310" cy="75" r="1.5" fill="#e2e8f0"/>
  <circle cx="310" cy="95" r="1.5" fill="#e2e8f0"/>
  <circle cx="470" cy="55" r="1.5" fill="#e2e8f0"/>
  <circle cx="470" cy="75" r="1.5" fill="#e2e8f0"/>
  <circle cx="470" cy="95" r="1.5" fill="#e2e8f0"/>
  <circle cx="620" cy="55" r="1.5" fill="#e2e8f0"/>
  <circle cx="620" cy="75" r="1.5" fill="#e2e8f0"/>
  <circle cx="620" cy="95" r="1.5" fill="#e2e8f0"/>

  <!-- REPOS -->
  <g class="c1">
    <text x="36" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">REPOS</text>
    <text x="36" y="92" font-size="38" font-weight="900" fill="#1e293b">87</text>
  </g>

  <!-- CONTRIBUTIONS (last year) -->
  <g class="c2">
    <text x="185" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">LAST YEAR</text>
    <text x="185" y="92" font-size="38" font-weight="900" fill="#1e293b">437</text>
  </g>

  <!-- STARS -->
  <g class="c3">
    <text x="330" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">STARS</text>
    <text x="330" y="92" font-size="38" font-weight="900" fill="#1e293b">14</text>
  </g>

  <!-- YEARS -->
  <g class="c4">
    <text x="490" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">YEARS</text>
    <text x="490" y="92" font-size="38" font-weight="900" fill="#d97706">9</text>
  </g>

  <!-- PRIMARY -->
  <g class="c5">
    <text x="640" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">PRIMARY</text>
    <text x="640" y="88" font-size="24" font-weight="700" fill="#d97706">Python</text>
  </g>

  <!-- LOCATION -->
  <g class="c6">
    <text x="800" y="52" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">HOME</text>
    <text x="800" y="88" font-size="24" font-weight="700" fill="#d97706">Sri Lanka</text>
  </g>
</svg>
