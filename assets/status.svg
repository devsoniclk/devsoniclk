<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="ship log">
  <style>@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s steps(1) infinite}</style>

  <rect x="1" y="1" width="938" height="118" rx="14" fill="#111" stroke="#ff4444" stroke-opacity="0.2" stroke-width="1"/>

  <text x="36" y="34" font-size="13" letter-spacing="2" fill="#ff6b35" font-weight="bold">$ ship_log --status</text>

  <text x="52" y="60" font-size="12" fill="#666">&gt; 19 vessels under the straw hat flag</text>
  <text x="52" y="80" font-size="12" fill="#666">&gt; armament: Python · TypeScript · JavaScript</text>
  <text x="52" y="100" font-size="12" fill="#666">&gt; sailing waters: autonomous agents · crypto infra · spatial sensing <tspan fill="#ff6b35" class="cur">█</tspan></text>
