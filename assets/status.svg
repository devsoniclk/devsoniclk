<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="system status">
  <style>@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s steps(1) infinite}</style>

  <!-- Panel -->
  <rect x="1" y="1" width="938" height="158" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="38" font-size="15" letter-spacing="2" fill="#0ea5e9" font-weight="bold">$ osiris --status --user devsoniclk</text>

  <!-- Status lines -->
  <text x="52" y="68" font-size="14" fill="#94a3b8">&gt; 76 repositories under management</text>
  <text x="52" y="92" font-size="14" fill="#94a3b8">&gt; primary stack: Python · TypeScript · JavaScript</text>
  <text x="52" y="116" font-size="14" fill="#94a3b8">&gt; active domains: autonomous agents · crypto infra · spatial sensing · adversarial security</text>
  <text x="52" y="140" font-size="14" fill="#94a3b8">&gt; all systems operational · horizon stable <tspan class="cur" fill="#0ea5e9">█</tspan></text>
</svg>
