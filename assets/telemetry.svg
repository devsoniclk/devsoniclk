<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-label="Grand Line — contribution journey since 2018">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&amp;display=swap');</style>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Lato',sans-serif}
    @keyframes islandPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
    .isle{animation:islandPop .4s ease-out both}
    @keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:barGrow .6s ease-out both}
    @keyframes drawRoute{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
    .route{stroke-dasharray:900;animation:drawRoute 3s ease-out both}
  </style>

  <rect width="940" height="380" fill="#fffef9" rx="12"/>

  <!-- Header -->
  <text x="36" y="30" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">GRAND LINE — CONTRIBUTION JOURNEY</text>
  <text x="904" y="30" font-size="10" fill="#cbd5e1" text-anchor="end">77 repos · 426 contributions last year · sailing since 2018</text>

  <!-- Sea area background -->
  <rect x="24" y="48" width="892" height="150" rx="8" fill="#f0f9ff" opacity="0.25"/>

  <!-- Route line -->
  <path class="route" d="M80,140 C140,130 180,110 240,115 C300,120 320,100 380,102 C440,104 460,85 520,88 C580,91 600,70 660,75 C720,80 740,55 800,60 C840,63 860,50 880,55"
        fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.35"/>

  <!-- Island markers -->

  <!-- 2018: East Blue -->
  <g class="isle" style="animation-delay:0.1s">
    <circle cx="80" cy="140" r="5" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <text x="80" y="128" text-anchor="middle" font-size="8" fill="#94a3b8">account born</text>
    <text x="80" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">2018</text>
    <text x="80" y="175" text-anchor="middle" font-size="8" fill="#94a3b8">East Blue</text>
  </g>

  <!-- 2019 -->
  <g class="isle" style="animation-delay:0.3s">
    <circle cx="170" cy="120" r="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <text x="170" y="140" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">2019</text>
  </g>

  <!-- 2020 -->
  <g class="isle" style="animation-delay:0.5s">
    <circle cx="250" cy="112" r="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <text x="250" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">2020</text>
  </g>

  <!-- 2021 -->
  <g class="isle" style="animation-delay:0.7s">
    <circle cx="330" cy="102" r="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <text x="330" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">2021</text>
  </g>

  <!-- 2022 -->
  <g class="isle" style="animation-delay:0.9s">
    <circle cx="410" cy="95" r="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="410" y="115" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">2022</text>
  </g>

  <!-- 2023 -->
  <g class="isle" style="animation-delay:1.1s">
    <circle cx="490" cy="88" r="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="490" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">2023</text>
  </g>

  <!-- 2024: New World -->
  <g class="isle" style="animation-delay:1.3s">
    <circle cx="570" cy="78" r="5" fill="#fcd34d" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="570" y="66" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">2024</text>
    <text x="570" y="98" text-anchor="middle" font-size="8" fill="#d97706">new world</text>
  </g>

  <!-- 2025: Awakening -->
  <g class="isle" style="animation-delay:1.6s">
    <circle cx="680" cy="70" r="6" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <text x="680" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">40</text>
    <text x="680" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">2025</text>
    <text x="680" y="104" text-anchor="middle" font-size="8" fill="#d97706">awakening</text>
  </g>

  <!-- 2026: Gear 5 — big island -->
  <g class="isle" style="animation-delay:2s">
    <circle cx="840" cy="52" r="8" fill="#d97706" stroke="#92400e" stroke-width="2.5"/>
    <text x="840" y="36" text-anchor="middle" font-size="16" font-weight="900" fill="#92400e">426</text>
    <text x="840" y="74" text-anchor="middle" font-size="11" font-weight="900" fill="#92400e">2026</text>
    <text x="840" y="88" text-anchor="middle" font-size="9" fill="#d97706" font-weight="700">GEAR 5</text>
  </g>

  <!-- Separator line -->
  <line x1="36" y1="210" x2="904" y2="210" stroke="#f1f5f9" stroke-width="1"/>

  <!-- 2026 Monthly breakdown -->
  <text x="36" y="236" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="2">2026 MONTHLY BREAKDOWN</text>

  <rect class="bar" x="36"  y="280" width="36" height="6"  rx="4" fill="#d97706" opacity="0.20" style="animation-delay:2.2s"/>
  <text x="54"  y="306" text-anchor="middle" font-size="9" fill="#94a3b8">Jan</text>

  <rect class="bar" x="86"  y="278" width="36" height="8"  rx="4" fill="#d97706" opacity="0.22" style="animation-delay:2.3s"/>
  <text x="104" y="306" text-anchor="middle" font-size="9" fill="#94a3b8">Feb</text>

  <rect class="bar" x="136" y="260" width="36" height="26" rx="4" fill="#d97706" opacity="0.40" style="animation-delay:2.4s"/>
  <text x="154" y="306" text-anchor="middle" font-size="9" fill="#94a3b8">Mar</text>

  <rect class="bar" x="186" y="276" width="36" height="10" rx="4" fill="#d97706" opacity="0.24" style="animation-delay:2.5s"/>
  <text x="204" y="306" text-anchor="middle" font-size="9" fill="#94a3b8">Apr</text>

  <rect class="bar" x="236" y="228" width="36" height="58" rx="4" fill="#d97706" opacity="0.70" style="animation-delay:2.6s"/>
  <text x="254" y="306" text-anchor="middle" font-size="9" fill="#94a3b8">May</text>

  <rect class="bar" x="286" y="186" width="36" height="100" rx="4" fill="#d97706" opacity="1.00" style="animation-delay:2.7s"/>
  <text x="304" y="306" text-anchor="middle" font-size="9" fill="#94a3b8">Jun</text>

  <rect class="bar" x="336" y="256" width="36" height="30" rx="4" fill="#d97706" opacity="0.42" style="animation-delay:2.8s"/>
  <text x="354" y="306" text-anchor="middle" font-size="9" fill="#94a3b8">Jul</text>

  <!-- Legend -->
  <g transform="translate(36, 340)">
    <circle cx="0" cy="0" r="4" fill="#cbd5e1"/>
    <text x="12" y="4" font-size="10" fill="#94a3b8">dormant</text>
    <circle cx="80" cy="0" r="4" fill="#fcd34d"/>
    <text x="92" y="4" font-size="10" fill="#94a3b8">waking</text>
    <circle cx="150" cy="0" r="4" fill="#d97706"/>
    <text x="162" y="4" font-size="10" fill="#94a3b8">active</text>
    <circle cx="210" cy="0" r="4" fill="#22c55e"/>
    <text x="222" y="4" font-size="10" fill="#94a3b8">today</text>
  </g>

  <!-- Bottom stats -->
  <text x="904" y="356" font-size="10" fill="#cbd5e1" text-anchor="end">77 repos · 14 stars · 5 languages · 9 years on the Grand Line</text>
</svg>
