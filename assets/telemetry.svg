<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="Grand Line — contribution journey since 2018">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&amp;display=swap');</style>
  </defs>
  <style>
    text{font-family:'Lato',sans-serif}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fadeUp .4s ease-out both}
    .f2{animation:fadeUp .4s ease-out .1s both}
    .f3{animation:fadeUp .4s ease-out .2s both}
    .f4{animation:fadeUp .4s ease-out .3s both}
    .f5{animation:fadeUp .4s ease-out .4s both}
    .f6{animation:fadeUp .4s ease-out .5s both}
    .f7{animation:fadeUp .4s ease-out .6s both}
    .f8{animation:fadeUp .4s ease-out .7s both}
    .f9{animation:fadeUp .4s ease-out .8s both}
    @keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:barGrow .5s ease-out both}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes drawLine{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
    .line{stroke-dasharray:800;animation:drawLine 2s ease-out both}
  </style>

  <rect width="940" height="340" fill="#fffef9" rx="12"/>

  <!-- Header -->
  <text x="36" y="30" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">GRAND LINE — CONTRIBUTION JOURNEY</text>
  <text x="904" y="30" font-size="10" fill="#cbd5e1" text-anchor="end">87 repos · 437 contributions last year · sailing since 2018</text>

  <!-- Straight timeline line -->
  <line class="line" x1="60" y1="110" x2="880" y2="110" stroke="#d97706" stroke-width="1.5" opacity="0.3"/>

  <!-- Year dots + labels -->

  <!-- 2018 -->
  <g class="f1">
    <circle cx="60" cy="110" r="5" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="95" text-anchor="middle" font-size="7" fill="#94a3b8">account born</text>
    <text x="60" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">2018</text>
    <text x="60" y="143" text-anchor="middle" font-size="7" fill="#94a3b8">East Blue</text>
  </g>

  <!-- 2019 -->
  <g class="f2">
    <circle cx="163" cy="110" r="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <text x="163" y="130" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">2019</text>
  </g>

  <!-- 2020 -->
  <g class="f3">
    <circle cx="266" cy="110" r="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <text x="266" y="130" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">2020</text>
  </g>

  <!-- 2021 -->
  <g class="f4">
    <circle cx="369" cy="110" r="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <text x="369" y="130" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">2021</text>
  </g>

  <!-- 2022 -->
  <g class="f5">
    <circle cx="472" cy="110" r="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="472" y="130" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">2022</text>
  </g>

  <!-- 2023 -->
  <g class="f6">
    <circle cx="575" cy="110" r="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="575" y="130" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">2023</text>
  </g>

  <!-- 2024 -->
  <g class="f7">
    <circle cx="660" cy="110" r="6" fill="#fcd34d" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="660" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">2024</text>
    <text x="660" y="143" text-anchor="middle" font-size="7" fill="#d97706">new world</text>
  </g>

  <!-- 2025 -->
  <g class="f8">
    <circle cx="750" cy="110" r="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <text x="750" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">40</text>
    <text x="750" y="134" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">2025</text>
    <text x="750" y="148" text-anchor="middle" font-size="7" fill="#d97706">awakening</text>
  </g>

  <!-- 2026 -->
  <g class="f9">
    <circle cx="860" cy="110" r="11" fill="#d97706" stroke="#92400e" stroke-width="2.5"/>
    <text x="860" y="68" text-anchor="middle" font-size="20" font-weight="900" fill="#92400e">437</text>
    <text x="860" y="140" text-anchor="middle" font-size="11" font-weight="900" fill="#92400e">2026</text>
    <text x="860" y="156" text-anchor="middle" font-size="9" fill="#d97706" font-weight="700">GEAR 5</text>
  </g>

  <!-- Separator -->
  <line x1="36" y1="175" x2="904" y2="175" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Monthly breakdown -->
  <text x="36" y="198" font-size="8" font-weight="700" fill="#94a3b8" letter-spacing="2">2026 MONTHLY BREAKDOWN</text>

  <!-- Jan --> <rect class="bar" x="36"  y="240" width="40" height="6"  rx="3" fill="#d97706" opacity="0.18" style="animation-delay:1s"/><text x="56"  y="268" text-anchor="middle" font-size="9" fill="#94a3b8">Jan</text>
  <!-- Feb --> <rect class="bar" x="92"  y="238" width="40" height="8"  rx="3" fill="#d97706" opacity="0.20" style="animation-delay:1.1s"/><text x="112" y="268" text-anchor="middle" font-size="9" fill="#94a3b8">Feb</text>
  <!-- Mar --> <rect class="bar" x="148" y="224" width="40" height="22" rx="3" fill="#d97706" opacity="0.35" style="animation-delay:1.2s"/><text x="168" y="268" text-anchor="middle" font-size="9" fill="#94a3b8">Mar</text>
  <!-- Apr --> <rect class="bar" x="204" y="236" width="40" height="10" rx="3" fill="#d97706" opacity="0.22" style="animation-delay:1.3s"/><text x="224" y="268" text-anchor="middle" font-size="9" fill="#94a3b8">Apr</text>
  <!-- May --> <rect class="bar" x="260" y="200" width="40" height="46" rx="3" fill="#d97706" opacity="0.60" style="animation-delay:1.4s"/><text x="280" y="268" text-anchor="middle" font-size="9" fill="#94a3b8">May</text>
  <!-- Jun --> <rect class="bar" x="316" y="162" width="40" height="84" rx="3" fill="#d97706" opacity="1.00" style="animation-delay:1.5s"/><text x="336" y="268" text-anchor="middle" font-size="9" fill="#94a3b8">Jun</text>
  <!-- Jul --> <rect class="bar" x="372" y="230" width="40" height="16" rx="3" fill="#d97706" opacity="0.30" style="animation-delay:1.6s"/><text x="392" y="268" text-anchor="middle" font-size="9" fill="#94a3b8">Jul</text>
  <!-- Aug --> <rect class="bar" x="428" y="234" width="40" height="12" rx="3" fill="#d97706" opacity="0.25" style="animation-delay:1.7s"/><text x="448" y="268" text-anchor="middle" font-size="9" fill="#94a3b8">Aug</text>

  <!-- Legend -->
  <g transform="translate(36, 298)">
    <circle class="pulse" cx="0" cy="0" r="3.5" fill="#cbd5e1"/>
    <text x="10" y="4" font-size="9" fill="#94a3b8">dormant</text>
    <circle class="pulse" cx="70" cy="0" r="3.5" fill="#fcd34d" style="animation-delay:.5s"/>
    <text x="80" y="4" font-size="9" fill="#94a3b8">waking</text>
    <circle class="pulse" cx="130" cy="0" r="3.5" fill="#d97706" style="animation-delay:1s"/>
    <text x="140" y="4" font-size="9" fill="#94a3b8">active</text>
    <circle class="pulse" cx="190" cy="0" r="3.5" fill="#22c55e" style="animation-delay:1.5s"/>
    <text x="200" y="4" font-size="9" fill="#94a3b8">today</text>
  </g>

  <!-- Bottom stats -->
  <text x="904" y="316" font-size="9" fill="#cbd5e1" text-anchor="end">87 repos · 14 stars · 5 languages · 9 years on the Grand Line</text>
</svg>
