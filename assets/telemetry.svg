<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-label="Grand Line — contribution journey since 2018">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&amp;display=swap');</style>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Lato',sans-serif}
    @keyframes islandPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
    .isle{animation:islandPop .4s ease-out both}
    @keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:barGrow .6s ease-out both}
  </style>

  <rect width="940" height="350" fill="#fffef9" rx="12"/>

  <!-- Header -->
  <text x="36" y="30" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">GRAND LINE — CONTRIBUTION JOURNEY</text>
  <text x="904" y="30" font-size="10" fill="#cbd5e1" text-anchor="end">77 repos · 426 contributions last year · sailing since 2018</text>

  <!-- Route line — flat gentle curve -->
  <line x1="70" y1="110" x2="870" y2="110" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.25"/>

  <!-- === YEAR ISLANDS === -->

  <!-- 2018: East Blue -->
  <g class="isle" style="animation-delay:0.1s">
    <circle cx="70" cy="110" r="6" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <text x="70" y="92" text-anchor="middle" font-size="8" fill="#94a3b8">account born</text>
    <text x="70" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">2018</text>
    <text x="70" y="145" text-anchor="middle" font-size="8" fill="#94a3b8">East Blue</text>
  </g>

  <!-- 2019 -->
  <g class="isle" style="animation-delay:0.3s">
    <circle cx="170" cy="110" r="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="170" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">2019</text>
  </g>

  <!-- 2020 -->
  <g class="isle" style="animation-delay:0.5s">
    <circle cx="270" cy="110" r="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="270" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">2020</text>
  </g>

  <!-- 2021 -->
  <g class="isle" style="animation-delay:0.7s">
    <circle cx="370" cy="110" r="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="370" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">2021</text>
  </g>

  <!-- 2022 -->
  <g class="isle" style="animation-delay:0.9s">
    <circle cx="460" cy="110" r="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="460" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">2022</text>
  </g>

  <!-- 2023 -->
  <g class="isle" style="animation-delay:1.1s">
    <circle cx="540" cy="110" r="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="540" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">2023</text>
  </g>

  <!-- 2024: New World -->
  <g class="isle" style="animation-delay:1.3s">
    <circle cx="630" cy="110" r="7" fill="#fcd34d" stroke="#f59e0b" stroke-width="2"/>
    <text x="630" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">2024</text>
    <text x="630" y="134" text-anchor="middle" font-size="8" fill="#d97706">new world</text>
  </g>

  <!-- 2025: Awakening -->
  <g class="isle" style="animation-delay:1.6s">
    <circle cx="740" cy="110" r="9" fill="#f59e0b" stroke="#d97706" stroke-width="2.5"/>
    <text x="740" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">40</text>
    <text x="740" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">2025</text>
    <text x="740" y="150" text-anchor="middle" font-size="8" fill="#d97706">awakening</text>
  </g>

  <!-- 2026: Gear 5 -->
  <g class="isle" style="animation-delay:2s">
    <circle cx="860" cy="110" r="12" fill="#d97706" stroke="#92400e" stroke-width="3"/>
    <text x="860" y="65" text-anchor="middle" font-size="20" font-weight="900" fill="#92400e">426</text>
    <text x="860" y="145" text-anchor="middle" font-size="12" font-weight="900" fill="#92400e">2026</text>
    <text x="860" y="163" text-anchor="middle" font-size="10" fill="#d97706" font-weight="700">GEAR 5</text>
  </g>

  <!-- Separator -->
  <line x1="36" y1="186" x2="904" y2="186" stroke="#f1f5f9" stroke-width="1"/>

  <!-- 2026 Monthly breakdown -->
  <text x="36" y="205" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="2">2026 MONTHLY BREAKDOWN</text>

  <rect class="bar" x="36"  y="248" width="40" height="8"   rx="4" fill="#d97706" opacity="0.20" style="animation-delay:2.2s"/>
  <text x="56"  y="278" text-anchor="middle" font-size="10" fill="#94a3b8">Jan</text>

  <rect class="bar" x="92"  y="246" width="40" height="10"  rx="4" fill="#d97706" opacity="0.22" style="animation-delay:2.3s"/>
  <text x="112" y="278" text-anchor="middle" font-size="10" fill="#94a3b8">Feb</text>

  <rect class="bar" x="148" y="226" width="40" height="30"  rx="4" fill="#d97706" opacity="0.40" style="animation-delay:2.4s"/>
  <text x="168" y="278" text-anchor="middle" font-size="10" fill="#94a3b8">Mar</text>

  <rect class="bar" x="204" y="244" width="40" height="12"  rx="4" fill="#d97706" opacity="0.24" style="animation-delay:2.5s"/>
  <text x="224" y="278" text-anchor="middle" font-size="10" fill="#94a3b8">Apr</text>

  <rect class="bar" x="260" y="202" width="40" height="54"  rx="4" fill="#d97706" opacity="0.70" style="animation-delay:2.6s"/>
  <text x="280" y="278" text-anchor="middle" font-size="10" fill="#94a3b8">May</text>

  <rect class="bar" x="316" y="168" width="40" height="88"  rx="4" fill="#d97706" opacity="1.00" style="animation-delay:2.7s"/>
  <text x="336" y="278" text-anchor="middle" font-size="10" fill="#94a3b8">Jun</text>

  <rect class="bar" x="372" y="232" width="40" height="24"  rx="4" fill="#d97706" opacity="0.42" style="animation-delay:2.8s"/>
  <text x="392" y="278" text-anchor="middle" font-size="10" fill="#94a3b8">Jul</text>

  <!-- Legend -->
  <g transform="translate(36, 310)">
    <circle cx="0" cy="0" r="4" fill="#cbd5e1"/>
    <text x="12" y="4" font-size="10" fill="#94a3b8">dormant</text>
    <circle cx="80" cy="0" r="4" fill="#fcd34d"/>
    <text x="92" y="4" font-size="10" fill="#94a3b8">waking</text>
    <circle cx="150" cy="0" r="4" fill="#d97706"/>
    <text x="162" y="4" font-size="10" fill="#94a3b8">active</text>
    <circle cx="210" cy="0" r="4" fill="#22c55e"/>
    <text x="222" y="4" font-size="10" fill="#94a3b8">today</text>
  </g>

  <!-- Bottom stats -->
  <text x="904" y="328" font-size="10" fill="#cbd5e1" text-anchor="end">77 repos · 14 stars · 5 languages · 9 years on the Grand Line</text>
</svg>
