<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" role="img" aria-label="Grand Line — contribution chart">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&amp;display=swap');</style>
    <linearGradient id="fadeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#d97706" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#d97706" stop-opacity="1"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Lato',sans-serif}
    @keyframes drawPath{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
    .route{stroke-dasharray:800;animation:drawPath 3s ease-out both}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .dot{animation:fadeIn .4s ease-out both}
    @keyframes gentlePulse{0%,100%{r:3;opacity:.6}50%{r:5;opacity:1}}
    .isle{animation:gentlePulse 3s ease-in-out infinite}
  </style>

  <rect width="940" height="200" fill="#fffef9" rx="12"/>

  <!-- Section label -->
  <text x="36" y="30" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="3">CONTRIBUTIONS — LAST 14 DAYS</text>

  <!-- Thin grid -->
  <line x1="36" y1="170" x2="900" y2="170" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="36" y1="130" x2="900" y2="130" stroke="#f1f5f9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="36" y1="90" x2="900" y2="90" stroke="#f1f5f9" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Activity bars — minimal -->
  <rect class="dot" style="animation-delay:0.1s" x="50"  y="152" width="24" height="18" rx="4" fill="#d97706" opacity="0.20"/>
  <rect class="dot" style="animation-delay:0.15s" x="112" y="142" width="24" height="28" rx="4" fill="#d97706" opacity="0.30"/>
  <rect class="dot" style="animation-delay:0.2s" x="174" y="128" width="24" height="42" rx="4" fill="#d97706" opacity="0.45"/>
  <rect class="dot" style="animation-delay:0.25s" x="236" y="112" width="24" height="58" rx="4" fill="#d97706" opacity="0.60"/>
  <rect class="dot" style="animation-delay:0.3s" x="298" y="98" width="24" height="72" rx="4" fill="#d97706" opacity="0.75"/>
  <rect class="dot" style="animation-delay:0.35s" x="360" y="80" width="24" height="90" rx="4" fill="#d97706" opacity="1.00"/>
  <rect class="dot" style="animation-delay:0.4s" x="422" y="105" width="24" height="65" rx="4" fill="#d97706" opacity="0.70"/>
  <rect class="dot" style="animation-delay:0.45s" x="484" y="118" width="24" height="52" rx="4" fill="#d97706" opacity="0.55"/>
  <rect class="dot" style="animation-delay:0.5s" x="546" y="108" width="24" height="62" rx="4" fill="#d97706" opacity="0.65"/>
  <rect class="dot" style="animation-delay:0.55s" x="608" y="125" width="24" height="45" rx="4" fill="#d97706" opacity="0.50"/>
  <rect class="dot" style="animation-delay:0.6s" x="670" y="115" width="24" height="55" rx="4" fill="#d97706" opacity="0.60"/>
  <rect class="dot" style="animation-delay:0.65s" x="732" y="95" width="24" height="75" rx="4" fill="#d97706" opacity="0.80"/>
  <rect class="dot" style="animation-delay:0.7s" x="794" y="85" width="24" height="85" rx="4" fill="#d97706" opacity="0.90"/>
  <rect class="dot" style="animation-delay:0.75s" x="856" y="92" width="24" height="78" rx="4" fill="#d97706" opacity="0.85"/>

  <!-- Route line overlay -->
  <path class="route" d="M62,155 C90,148 124,142 186,130 C248,118 310,100 372,82 C434,108 496,120 558,110 C620,128 682,118 744,98 C806,88 868,95 880,95"
        fill="none" stroke="url(#fadeLine)" stroke-width="1.5" opacity="0.5"/>

  <!-- Island markers -->
  <circle class="isle" cx="372" cy="80" r="3" fill="#d97706" style="animation-delay:0s"/>
  <circle class="isle" cx="794" cy="85" r="3" fill="#d97706" style="animation-delay:1s"/>
  <circle class="isle" cx="880" cy="92" r="4" fill="#22c55e" style="animation-delay:2s"/>

  <!-- Legend -->
  <text x="36" y="190" font-size="10" fill="#cbd5e1">each bar = 1 day · taller = more contributions</text>
  <circle cx="860" cy="186" r="3" fill="#22c55e"/>
  <text x="870" y="190" font-size="10" fill="#94a3b8">today</text>
</svg>
