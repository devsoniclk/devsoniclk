<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="'Georgia','Times New Roman',serif" role="img" aria-label="Grand Line — contribution sea chart">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="watercolor">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
  </defs>
  <style>
    @keyframes sail{from{offset-distance:0%}to{offset-distance:100%}}
    .ship{offset-path:path('M60,200 C120,180 160,120 220,140 C280,160 300,100 380,110 C460,120 440,180 520,160 C600,140 580,80 660,100 C740,120 720,180 800,150 C840,140 860,120 880,130');animation:sail 12s linear infinite}
    @keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
    .wave{animation:wave 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{r:4}50%{r:7}}
    .isle{animation:pulse 2.5s ease-in-out infinite}
    @keyframes fadein{from{opacity:0}to{opacity:1}}
    .fi{animation:fadein 1s ease-out both}
  </style>

  <!-- Parchment background -->
  <rect x="1" y="1" width="938" height="298" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Sea area -->
  <rect x="20" y="50" width="900" height="200" rx="8" fill="url(#sea)" opacity="0.4" filter="url(#watercolor)"/>

  <!-- Compass rose -->
  <g transform="translate(870, 75)" opacity="0.4">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="0" y="-32" text-anchor="middle" font-size="10" fill="#ca8a04" font-weight="bold">N</text>
    <text x="0" y="42" text-anchor="middle" font-size="10" fill="#ca8a04">S</text>
    <text x="38" y="4" text-anchor="middle" font-size="10" fill="#ca8a04">E</text>
    <text x="-38" y="4" text-anchor="middle" font-size="10" fill="#ca8a04">W</text>
    <polygon points="0,-22 4,-6 -4,-6" fill="#ca8a04"/>
    <polygon points="0,22 4,6 -4,6" fill="#ca8a04" opacity="0.5"/>
    <polygon points="22,0 6,4 6,-4" fill="#ca8a04" opacity="0.5"/>
    <polygon points="-22,0 -6,4 -6,-4" fill="#ca8a04" opacity="0.5"/>
  </g>

  <!-- Header -->
  <text x="36" y="36" font-size="15" letter-spacing="3" fill="#92400e" font-weight="bold">⚓ GRAND LINE — CONTRIBUTION SEA CHART</text>

  <!-- Route path (dashed) -->
  <path d="M60,200 C120,180 160,120 220,140 C280,160 300,100 380,110 C460,120 440,180 520,160 C600,140 580,80 660,100 C740,120 720,180 800,150 C840,140 860,120 880,130"
        fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="8 4" opacity="0.5"/>

  <!-- Island markers (contribution peaks) -->
  <circle class="isle" cx="60" cy="200" r="5" fill="#f59e0b" style="animation-delay:0s"/>
  <circle class="isle" cx="220" cy="140" r="5" fill="#f59e0b" style="animation-delay:0.3s"/>
  <circle class="isle" cx="380" cy="110" r="6" fill="#ef4444" style="animation-delay:0.6s"/>
  <circle class="isle" cx="520" cy="160" r="5" fill="#f59e0b" style="animation-delay:0.9s"/>
  <circle class="isle" cx="660" cy="100" r="5" fill="#22c55e" style="animation-delay:1.2s"/>
  <circle class="isle" cx="800" cy="150" r="6" fill="#ef4444" style="animation-delay:1.5s"/>
  <circle class="isle" cx="880" cy="130" r="5" fill="#22c55e" style="animation-delay:1.8s"/>

  <!-- Island labels -->
  <text x="60" y="225" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">START</text>
  <text x="220" y="165" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">WK 1</text>
  <text x="380" y="135" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">WK 2</text>
  <text x="520" y="185" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">WK 3</text>
  <text x="660" y="125" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">WK 4</text>
  <text x="800" y="175" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">WK 5</text>
  <text x="880" y="115" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">NOW</text>

  <!-- Animated ship -->
  <g class="ship">
    <polygon points="0,-8 5,8 -5,8" fill="#92400e" stroke="#78350f" stroke-width="1"/>
    <line x1="0" y1="-8" x2="0" y2="-14" stroke="#78350f" stroke-width="1.5"/>
    <rect x="-1" y="-18" width="8" height="6" rx="1" fill="#dc2626" stroke="#991b1b" stroke-width="0.5"/>
  </g>

  <!-- Stats bar -->
  <g class="fi" style="animation-delay:0.5s">
    <text x="36" y="275" font-size="12" fill="#92400e" font-family="monospace">▸ 14-DAY VOYAGE</text>
    <rect x="190" y="262" width="18" height="16" rx="3" fill="#fcd34d" opacity="0.5"/>
    <rect x="212" y="258" width="18" height="20" rx="3" fill="#f59e0b" opacity="0.6"/>
    <rect x="234" y="252" width="18" height="26" rx="3" fill="#d97706" opacity="0.7"/>
    <rect x="256" y="248" width="18" height="30" rx="3" fill="#b45309" opacity="0.8"/>
    <rect x="278" y="254" width="18" height="24" rx="3" fill="#d97706" opacity="0.7"/>
    <rect x="300" y="250" width="18" height="28" rx="3" fill="#b45309" opacity="0.75"/>
    <rect x="322" y="260" width="18" height="18" rx="3" fill="#f59e0b" opacity="0.6"/>
    <rect x="344" y="256" width="18" height="22" rx="3" fill="#d97706" opacity="0.65"/>
    <rect x="366" y="262" width="18" height="16" rx="3" fill="#fcd34d" opacity="0.5"/>
    <rect x="388" y="264" width="18" height="14" rx="3" fill="#fcd34d" opacity="0.45"/>
    <rect x="410" y="258" width="18" height="20" rx="3" fill="#f59e0b" opacity="0.6"/>
    <rect x="432" y="250" width="18" height="28" rx="3" fill="#b45309" opacity="0.75"/>
    <rect x="454" y="246" width="18" height="32" rx="3" fill="#92400e" opacity="0.85"/>
    <rect x="476" y="252" width="18" height="26" rx="3" fill="#b45309" opacity="0.7"/>
  </g>

  <!-- Legend -->
  <text x="530" y="275" font-size="11" fill="#92400e" font-family="monospace">LEGEND:</text>
  <circle cx="590" cy="271" r="4" fill="#ef4444"/>
  <text x="600" y="276" font-size="10" fill="#78350f">PEAK</text>
  <circle cx="645" cy="271" r="4" fill="#22c55e"/>
  <text x="655" y="276" font-size="10" fill="#78350f">PORT</text>
  <circle cx="695" cy="271" r="4" fill="#f59e0b"/>
  <text x="705" y="276" font-size="10" fill="#78350f">VOYAGE</text>

  <!-- Waves decoration -->
  <g class="wave" opacity="0.15">
    <path d="M20,260 Q40,250 60,260 Q80,270 100,260 Q120,250 140,260 Q160,270 180,260 Q200,250 220,260 Q240,270 260,260 Q280,250 300,260" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  </g>
</svg>
