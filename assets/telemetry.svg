<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="fleet telemetry">
  <style>
    @keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .dot{animation:pulse 2.2s ease-in-out infinite}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s ease-out both}
  </style>

  <!-- Panel -->
  <rect x="1" y="1" width="938" height="278" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" font-size="14" letter-spacing="2" fill="#0ea5e9" font-weight="bold">OSIRIS // FLEET TELEMETRY</text>
  <text x="904" y="42" font-size="12" letter-spacing="1.5" fill="#94a3b8" text-anchor="end">DEVSONICLK · LIVE <tspan class="dot" fill="#22c55e">●</tspan></text>
  <line x1="24" y1="56" x2="916" y2="56" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Stats -->
  <text x="36" y="90" font-size="13" fill="#94a3b8">▸ REPOSITORIES<tspan dx="8" fill="#0f172a" font-weight="600">76</tspan></text>
  <text x="36" y="118" font-size="13" fill="#94a3b8">▸ TOTAL STARS<tspan dx="8" fill="#0f172a" font-weight="600">31</tspan></text>
  <text x="36" y="146" font-size="13" fill="#94a3b8">▸ PRIMARY<tspan dx="8" fill="#0f172a" font-weight="600">PYTHON</tspan></text>
  <text x="36" y="174" font-size="13" fill="#94a3b8">▸ LANGUAGES<tspan dx="8" fill="#0f172a" font-weight="600">5 ACTIVE</tspan></text>
  <text x="36" y="202" font-size="13" fill="#94a3b8">▸ LOCATION<tspan dx="8" fill="#0f172a" font-weight="600">SRI LANKA</tspan></text>
  <text x="36" y="230" font-size="13" fill="#94a3b8">▸ FOLLOWERS / FOLLOWING<tspan dx="8" fill="#0f172a" font-weight="600">0 / 7</tspan></text>

  <!-- Activity chart -->
  <text x="580" y="90" font-size="11" letter-spacing="2" fill="#94a3b8">ACTIVITY // 14D</text>
  <rect class="bar" x="580" y="200" width="16" height="8" rx="3" fill="#0ea5e9" opacity="0.25" style="animation-delay:0.00s"/>
  <rect class="bar" x="602" y="190" width="16" height="18" rx="3" fill="#0ea5e9" opacity="0.30" style="animation-delay:0.08s"/>
  <rect class="bar" x="624" y="160" width="16" height="48" rx="3" fill="#0ea5e9" opacity="0.50" style="animation-delay:0.16s"/>
  <rect class="bar" x="646" y="110" width="16" height="98" rx="3" fill="#0ea5e9" opacity="1.00" style="animation-delay:0.24s"/>
  <rect class="bar" x="668" y="170" width="16" height="38" rx="3" fill="#0ea5e9" opacity="0.42" style="animation-delay:0.32s"/>
  <rect class="bar" x="690" y="155" width="16" height="53" rx="3" fill="#0ea5e9" opacity="0.52" style="animation-delay:0.40s"/>
  <rect class="bar" x="712" y="192" width="16" height="16" rx="3" fill="#0ea5e9" opacity="0.28" style="animation-delay:0.48s"/>
  <rect class="bar" x="734" y="188" width="16" height="20" rx="3" fill="#0ea5e9" opacity="0.32" style="animation-delay:0.56s"/>
  <rect class="bar" x="756" y="195" width="16" height="13" rx="3" fill="#0ea5e9" opacity="0.26" style="animation-delay:0.64s"/>
  <rect class="bar" x="778" y="205" width="16" height="3" rx="3" fill="#0ea5e9" opacity="0.20" style="animation-delay:0.72s"/>
  <rect class="bar" x="800" y="200" width="16" height="8" rx="3" fill="#0ea5e9" opacity="0.25" style="animation-delay:0.80s"/>
  <rect class="bar" x="822" y="192" width="16" height="16" rx="3" fill="#0ea5e9" opacity="0.28" style="animation-delay:0.88s"/>
  <rect class="bar" x="844" y="186" width="16" height="22" rx="3" fill="#0ea5e9" opacity="0.33" style="animation-delay:0.96s"/>
  <rect class="bar" x="866" y="180" width="16" height="28" rx="3" fill="#0ea5e9" opacity="0.38" style="animation-delay:1.04s"/>
  <line x1="578" y1="208" x2="884" y2="208" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Footer -->
  <text x="36" y="260" font-size="12" letter-spacing="1" fill="#94a3b8">TARGETS: FLY.IO · SUPABASE · BINANCE · TELEGRAM <tspan class="cur" fill="#0ea5e9">█</tspan></text>
</svg>
